<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa - Reporte Animalistas de Corazón</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;background:#f4f8f7;font-family:Arial,sans-serif;color:#263238}.modal{max-width:720px;margin:24px auto;background:#fff;border-radius:20px;box-shadow:0 15px 45px #0002;overflow:hidden}.head{padding:18px 24px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:12px}.head h2{margin:0;color:#263238}.logo{width:42px;height:42px;border-radius:50%;background:#00a39e;display:grid;place-items:center;color:white;font-size:22px}.form{padding:20px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:14px}.field textarea{min-height:90px}.photo{border:2px dashed #cbd5e1;border-radius:12px;padding:14px;background:#f8fafc}.photo img{display:none;width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:10px}.loc{padding:14px;border:1px solid #a7e1df;background:#f0fdfa;border-radius:12px}.locgrid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}.hint{font-size:12px;color:#64748b;margin-top:7px}.map{height:300px;border-radius:10px;margin-top:12px;display:none}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.mapbtn{background:#00a39e;color:#fff;margin-top:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.publish{background:#00a39e;color:#fff}.cancel{background:#fff;border:1px solid #d1d5db}.status{font-size:12px;font-weight:700;color:#006e6b;margin-top:7px}@media(max-width:650px){.grid,.locgrid{grid-template-columns:1fr}.full{grid-column:auto}.modal{margin:0;border-radius:0;min-height:100vh}}</style></head><body><div class="modal"><div class="head"><div class="logo">🐾</div><h2>🐾 Reportar Mascota Perdida</h2></div><form class="form" id="f"><div class="grid"><div class="field"><label>Especie *</label><select required><option>Perro</option><option>Gato</option><option>Otro</option></select></div><div class="field"><label>Nombre de la Mascota</label><input placeholder="Ej. Max"></div><div class="field"><label>Raza Aprox.</label><input placeholder="Ej. Criollo / Labrador"></div><div class="field"><label>Color Dominante</label><input placeholder="Ej. Negro con blanco"></div><div class="field full"><label>📸 Fotografía de la mascota *</label><div class="photo"><input id="photo" type="file" accept="image/*" required><div class="hint" id="ph">Sube una foto clara. Se optimizará automáticamente.</div><img id="prev"></div></div><div class="field full"><label>📍 Ubicación del reporte *</label><div class="loc"><div class="locgrid"><select id="dep" required><option value="">1. Departamento</option><option>Bogotá D.C.</option><option>Cundinamarca</option><option>Antioquia</option><option>Valle del Cauca</option><option>Santander</option><option>Atlántico</option><option>Bolívar</option></select><select id="city" required><option value="">2. Ciudad / Municipio</option></select><input id="ref" required placeholder="3. Dirección o referencia"></div><div class="hint">Primero selecciona departamento → ciudad → dirección/referencia. Luego marca el punto exacto.</div><button type="button" class="btn mapbtn" id="open">🗺️ Marcar punto exacto en el mapa</button><div id="map" class="map"></div><div id="status" class="status">Aún no has marcado el punto.</div></div></div><div class="field"><label>Teléfono de Contacto *</label><input type="tel" required placeholder="+57 300 123 4567"></div><div class="field full"><label>Descripción / Detalles de la emergencia *</label><textarea required placeholder="Describe señas físicas, collar, comportamiento o cualquier detalle que ayude a encontrarla..."></textarea></div></div><div class="actions"><button type="button" class="btn cancel">Cancelar</button><button class="btn publish">Publicar Reporte</button></div></form></div><script>const cities={'Bogotá D.C.':['Bogotá'],'Cundinamarca':['Soacha','Chía','Zipaquirá','Facatativá','Fusagasugá'],'Antioquia':['Medellín','Bello','Envigado','Itagüí'],'Valle del Cauca':['Cali','Palmira','Tuluá','Buga','Cartago'],'Santander':['Bucaramanga','Floridablanca','Girón'],'Atlántico':['Barranquilla','Soledad'],'Bolívar':['Cartagena']};const center={Bogotá:[4.711,-74.072],Soacha:[4.579,-74.216],Chía:[4.862,-74.058],Medellín:[6.244,-75.581],Cali:[3.452,-76.532],Bucaramanga:[7.119,-73.122],Barranquilla:[10.968,-74.781],Cartagena:[10.391,-75.479]};dep.onchange=()=>{city.innerHTML='<option value="">2. Ciudad / Municipio</option>'+(cities[dep.value]||[]).map(x=>`<option>${x}</option>`).join('')};let map,marker;open.onclick=()=>{map.style.display='block';if(!map._leaflet_id){map=L.map('map').setView(center[city.value]||center.Bogotá,14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng))}setTimeout(()=>map.invalidateSize(),50)};function setPoint(lat,lng){if(marker)marker.remove();marker=L.marker([lat,lng],{draggable:true}).addTo(map);marker.on('dragend',e=>{let p=e.target.getLatLng();setPoint(p.lat,p.lng)});status.textContent=`📍 Punto marcado: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;map.setView([lat,lng],16)};photo.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{prev.src=r.result;prev.style.display='block';ph.textContent='✓ Foto cargada. Lista para publicar.'};r.readAsDataURL(f)};city.onchange=()=>{if(map&&center[city.value])map.setView(center[city.value],14)};f.onsubmit=e=>{e.preventDefault();alert('Vista previa: el reporte requerirá foto y punto exacto antes de publicarse.')}};</script></body></html>
